type: "SIMPLE"
title: "&8&lOpciones de {target}"
content:
  - "&7Opciones disponibles para &f{target}&7."
buttons:
  perfil:
    text: "&e&lPerfil de {target}\n&7Estado: {target_status}"
  clan_invite:
    text: "&5&lInvitar al clan\n&7Envía una invitación a"
    action: "COMMAND_PLAYER"
    commands:
      - "clan invitar {target}"
    close-on-click: true
  carta:
    text: "&6&lEnviar carta\n&7Escribe una carta para"
    action: "START_MAIL_SEND_TARGET"
    close-on-click: true
  party:
    text: "&d&lInvitar al grupo\n&7Invita a &e{target} &7a tu"
    action: "INVITE_PARTY_TARGET"
    close-on-click: true
    visible-when: "online"
  offline_info:
    text: "&8&lCompañero desconectado\n&7Este jugador no está"
    visible-when: "offline"
  tpa:
    text: "&a&lSolicitar viaje\n&7Envía una solicitud de TPA"
    action: "COMMAND_PLAYER"
    commands:
      - "tpa {target}"
    visible-when: "online"
  volver:
    text: "&6&lVolver\n&7Regresa a la lista"
    action: "OPEN_BEDROCK_FRIENDS"
    commands:
      - "friends"
